openapi: 3.0.3
info:
  title: FitControl API
  description: >
    API REST para el sistema de gestion de gimnasio FitControl.
    Expone los servicios de autenticacion y procesamiento de pagos
    de membresias para consumo externo.
  version: "1.0.0"
servers:
  - url: https://api.fitcontrol.com/v1
    description: Servidor de produccion

tags:
  - name: Autenticacion
    description: Login y generacion de tokens JWT
  - name: Pagos
    description: Procesamiento de pagos de membresias

paths:
  /auth/login:
    post:
      tags:
        - Autenticacion
      summary: Autenticar usuario
      description: Valida las credenciales del usuario y retorna un token JWT.
      operationId: loginUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              ejemplo:
                value:
                  email: admin@fitcontrol.com
                  password: MiClaveSegura123
      responses:
        '200':
          description: Autenticacion exitosa. Retorna el token JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: El correo o la contrasena son incorrectos.

  /payments/process:
    post:
      tags:
        - Pagos
      summary: Procesar el pago de una membresia
      description: >
        Procesa el cobro de una membresia usando un token de tarjeta.
        Requiere autenticacion mediante JWT (Bearer token).
      operationId: procesarPago
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            examples:
              ejemplo:
                value:
                  amount: 250.00
                  currency: GTQ
                  cardToken: tok_1Hh1XyZk9
      responses:
        '201':
          description: Pago procesado con exito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              example:
                success: true
                data:
                  transactionId: txn_9F3kD8sL2q
                  status: APPROVED
        '400':
          description: Solicitud invalida (datos faltantes o incorrectos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_REQUEST
                  message: El monto (amount) es obligatorio y debe ser mayor a 0.
        '401':
          description: Token JWT ausente o invalido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT obtenido en /auth/login. Enviar como: Authorization: Bearer <token>'

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@fitcontrol.com
        password:
          type: string
          format: password
          minLength: 6
          example: MiClaveSegura123

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              description: Token JWT de acceso.
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0In0.abc123signature
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              description: Tiempo de expiracion del token, en segundos.
              example: 3600
            usuario:
              type: object
              properties:
                id:
                  type: integer
                  example: 12
                rol:
                  type: string
                  example: Administrador

    PaymentRequest:
      type: object
      required:
        - amount
        - currency
        - cardToken
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 250.00
        currency:
          type: string
          description: Codigo de moneda ISO 4217.
          example: GTQ
        cardToken:
          type: string
          description: Token de la tarjeta generado por la pasarela de pago.
          example: tok_1Hh1XyZk9

    PaymentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            transactionId:
              type: string
              example: txn_9F3kD8sL2q
            status:
              type: string
              enum:
                - APPROVED
                - DECLINED
              example: APPROVED

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_REQUEST
            message:
              type: string
              example: Descripcion legible del error.